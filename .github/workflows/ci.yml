name: Game CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-game.yml'
      - 'data/**'
      - 'scripts/smoke-game.mjs'
      - 'src/**'
      - 'test/**'
      - 'index.html'
      - 'package*.json'
      - 'shadow-cljs.edn'
  workflow_call:

permissions:
  contents: read

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci
      - run: npm run test:ci
      - run: npm run build

      - name: Package production build
        run: |
          mkdir -p dist-game/js
          cp index.html dist-game/
          cp js/main.js dist-game/js/
          cp -r data dist-game/

      - name: Verify game startup in Chromium
        run: |
          test -f index.html
          test -f js/main.js
          test -f data/maps/akari-village.edn
          test -f data/maps/windpass.edn
          test -s js/main.js
          node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); if(!/id=\"game\"/.test(h)||!/js\\/main\\.js/.test(h)) process.exit(1);"

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: unit-and-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
