name: Game CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-game.yml'
      - 'data/**'
      - 'scripts/smoke-game.mjs'
      - 'src/**'
      - 'test/**'
      - 'index.html'
      - 'package*.json'
      - 'shadow-cljs.edn'
  workflow_call:

permissions:
  contents: read

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci
      - run: npm run test:ci
      - run: npm run build

      - name: Package production build
        run: |
          mkdir -p dist-game/js
          cp index.html dist-game/
          cp js/main.js dist-game/js/
          cp -r data dist-game/

      - name: Verify game startup in Chromium
        run: |
          npx --no-install playwright install --with-deps chromium
          node scripts/smoke-game.mjs dist-game

      - uses: actions/upload-artifact@v4
        with:
          name: rpg-game
          path: dist-game/
          if-no-files-found: error
          retention-days: 7
